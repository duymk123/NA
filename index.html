<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff5f2" />
    <meta name="description" content="Một trang nhỏ gửi đến Phạm Thị Ngọc Anh." />
    <title>Gửi Ngọc Anh một trái tim</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #542b35;
        --rose: #e94d69;
        --rose-dark: #cf3155;
        --paper: #fff8f5;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 50% 30%, rgba(255, 218, 218, .55), transparent 34%),
          radial-gradient(circle at 12% 14%, rgba(255, 228, 214, .74), transparent 25%),
          radial-gradient(circle at 90% 83%, rgba(255, 220, 228, .7), transparent 27%),
          var(--paper);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      .scene {
        position: relative;
        isolation: isolate;
        display: grid;
        justify-items: center;
        align-content: center;
        width: min(100%, 860px);
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 auto;
        padding: 48px 24px 60px;
        text-align: center;
      }

      .halo {
        position: absolute;
        z-index: -1;
        top: 20%;
        left: 50%;
        width: min(76vw, 440px);
        aspect-ratio: 1;
        border: 1px solid rgba(228, 112, 132, .14);
        border-radius: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 0 28px rgba(228, 112, 132, .035), 0 0 0 58px rgba(228, 112, 132, .025);
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 24px;
        color: #a66c73;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .28em;
        text-transform: uppercase;
        animation: fade-up .8s .1s both;
      }

      .heart-stage {
        position: relative;
        display: grid;
        width: 220px;
        height: 174px;
        place-items: center;
        margin: 0 0 14px;
        animation: fade-up .9s .18s both;
      }

      .heart-glow {
        position: absolute;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: rgba(236, 70, 101, .18);
        filter: blur(35px);
        animation: glow 2.3s ease-in-out infinite;
      }

      .heart-wrap {
        position: relative;
        display: grid;
        width: 110px;
        height: 110px;
        place-items: center;
        animation: float 3.6s ease-in-out infinite;
        filter: drop-shadow(0 18px 16px rgba(190, 52, 79, .22));
      }

      .heart {
        position: relative;
        width: 74px;
        height: 74px;
        background: linear-gradient(145deg, #fa7890 3%, var(--rose) 53%, var(--rose-dark));
        transform: rotate(-45deg);
        animation: beat 1.55s ease-in-out infinite;
      }

      .heart::before, .heart::after {
        position: absolute;
        width: 74px;
        height: 74px;
        content: "";
        background: inherit;
        border-radius: 50%;
      }

      .heart::before { top: -37px; left: 0; }
      .heart::after { top: 0; left: 37px; }

      .heart-shine {
        position: absolute;
        z-index: 1;
        top: 20px;
        left: 18px;
        width: 17px;
        height: 29px;
        border-radius: 100% 20% 90% 20%;
        background: linear-gradient(160deg, rgba(255,255,255,.8), rgba(255,255,255,0));
        transform: rotate(8deg);
        pointer-events: none;
      }

      .sparkle {
        position: absolute;
        width: 9px;
        height: 9px;
        color: #dc8190;
        animation: twinkle 2.2s ease-in-out infinite;
      }

      .sparkle::before, .sparkle::after {
        position: absolute;
        top: 50%;
        left: 50%;
        display: block;
        content: "";
        background: currentColor;
        border-radius: 9px;
        transform: translate(-50%, -50%);
      }

      .sparkle::before { width: 2px; height: 100%; }
      .sparkle::after { width: 100%; height: 2px; }
      .sparkle-one { top: 27px; left: 22px; animation-delay: -.4s; }
      .sparkle-two { top: 55px; right: 18px; width: 7px; height: 7px; animation-delay: -1.3s; }
      .sparkle-three { right: 38px; bottom: 7px; width: 6px; height: 6px; color: #efb3a5; animation-delay: -.8s; }

      h1 {
        margin: 0;
        color: #5a3039;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 7vw, 52px);
        font-weight: 400;
        letter-spacing: -.045em;
        line-height: 1.13;
        animation: fade-up .9s .3s both;
      }

      .message {
        margin: 15px 0 0;
        color: #9a6e74;
        font-size: 14px;
        letter-spacing: .025em;
        animation: fade-up .9s .42s both;
      }

      .tiny-heart {
        display: inline-block;
        margin: 0 4px;
        color: var(--rose);
        animation: tiny-beat 1.1s ease-in-out infinite;
      }

      .photo-gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 228px));
        gap: 26px;
        justify-content: center;
        width: 100%;
        margin: 32px 0 24px;
        animation: fade-up .9s .52s both;
      }

      .photo-card {
        align-self: start;
        margin: 0;
        padding: 9px 9px 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .9);
        border-radius: 5px;
        background: #fffdfb;
        box-shadow: 0 14px 34px rgba(120, 62, 72, .14), 0 2px 6px rgba(120, 62, 72, .07);
        transition: transform .35s ease, box-shadow .35s ease;
      }

      .photo-card:first-child { transform: rotate(-3deg) translateY(3px); }
      .photo-card:nth-child(2) { transform: rotate(3deg) translateY(13px); }
      .photo-card:nth-child(3) { transform: rotate(-2deg) translateY(7px); }
      .photo-card:nth-child(4) { transform: rotate(2.5deg) translateY(1px); }

      .photo-card:hover {
        z-index: 1;
        box-shadow: 0 20px 42px rgba(120, 62, 72, .2);
        transform: rotate(0) translateY(-5px) scale(1.025);
      }

      .photo-card img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        border-radius: 2px;
        object-fit: cover;
        object-position: center 42%;
      }

      .photo-card--story img {
        aspect-ratio: 9 / 20;
        object-position: center;
      }

      .photo-card figcaption {
        padding: 11px 3px 0;
        color: #a16f76;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 15px;
        font-style: italic;
      }

      .music-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        min-height: 46px;
        padding: 0 19px;
        border: 1px solid rgba(191, 111, 123, .25);
        border-radius: 999px;
        color: #89535d;
        background: rgba(255, 255, 255, .68);
        box-shadow: 0 6px 18px rgba(119, 63, 73, .07);
        font: inherit;
        font-size: 13px;
        letter-spacing: .025em;
        cursor: pointer;
        transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
        animation: fade-up .9s .62s both;
      }

      .music-toggle:hover {
        background: #fff;
        box-shadow: 0 9px 24px rgba(119, 63, 73, .12);
        transform: translateY(-2px);
      }

      .music-toggle:focus-visible {
        outline: 3px solid rgba(218, 92, 116, .35);
        outline-offset: 3px;
      }

      .music-note { color: var(--rose); font-size: 19px; line-height: 1; }
      .music-toggle[aria-pressed="true"] .music-note { animation: note-dance .8s ease-in-out infinite alternate; }

      .music-hint {
        margin: 9px 0 0;
        color: #ad8589;
        font-size: 11px;
        letter-spacing: .03em;
      }

      .floaty {
        position: absolute;
        z-index: -1;
        color: rgba(226, 116, 134, .25);
        font-family: Georgia, serif;
        user-select: none;
        animation: drift 8s ease-in-out infinite;
      }

      .floaty-a { top: 12%; left: 14%; font-size: 28px; }
      .floaty-b { top: 18%; right: 16%; font-size: 19px; animation-delay: -3s; }
      .floaty-c { right: 12%; bottom: 12%; font-size: 31px; animation-delay: -5s; }
      .floaty-d { bottom: 14%; left: 18%; font-size: 16px; animation-delay: -2s; }

      @keyframes beat {
        0%, 28%, 100% { transform: rotate(-45deg) scale(1); }
        8% { transform: rotate(-45deg) scale(1.09); }
        16% { transform: rotate(-45deg) scale(1.02); }
        22% { transform: rotate(-45deg) scale(1.12); }
      }
      @keyframes float { 0%, 100% { transform: translateY(3px); } 50% { transform: translateY(-8px); } }
      @keyframes glow { 0%, 100% { opacity: .55; transform: scale(.88); } 50% { opacity: .9; transform: scale(1.08); } }
      @keyframes twinkle { 0%, 100% { opacity: .36; transform: scale(.7) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(45deg); } }
      @keyframes drift { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-13px) rotate(8deg); } }
      @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes tiny-beat { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.35); } }
      @keyframes note-dance { from { transform: translateY(1px) rotate(-10deg); } to { transform: translateY(-2px) rotate(10deg); } }

      @media (max-width: 520px) {
        .scene { padding: 38px 18px 48px; }
        .eyebrow { margin-bottom: 17px; }
        .heart-stage { margin-bottom: 10px; transform: scale(.82); }
        .photo-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; margin: 26px 0 23px; }
        .photo-card { padding: 7px 7px 10px; }
        .photo-card:first-child { transform: rotate(-2deg) translateY(1px); }
        .photo-card:nth-child(2) { transform: rotate(2deg) translateY(8px); }
        .photo-card:nth-child(3) { transform: rotate(-1.5deg) translateY(5px); }
        .photo-card:nth-child(4) { transform: rotate(1.5deg) translateY(0); }
        .photo-card figcaption { padding-top: 9px; font-size: 13px; }
        .floaty-a { left: 8%; }
        .floaty-b { right: 8%; }
        .floaty-c { right: 7%; bottom: 8%; }
        .floaty-d { left: 8%; bottom: 9%; }
        .message { max-width: 28ch; line-height: 1.7; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="halo" aria-hidden="true"></div>
      <span class="floaty floaty-a" aria-hidden="true">♡</span>
      <span class="floaty floaty-b" aria-hidden="true">✦</span>
      <span class="floaty floaty-c" aria-hidden="true">♡</span>
      <span class="floaty floaty-d" aria-hidden="true">✧</span>

      <p class="eyebrow">Gửi đến một người đặc biệt</p>
      <div class="heart-stage" role="img" aria-label="Trái tim đang đập">
        <span class="heart-glow" aria-hidden="true"></span>
        <span class="heart-wrap" aria-hidden="true">
          <span class="heart"></span>
          <span class="heart-shine"></span>
        </span>
        <span class="sparkle sparkle-one" aria-hidden="true"></span>
        <span class="sparkle sparkle-two" aria-hidden="true"></span>
        <span class="sparkle sparkle-three" aria-hidden="true"></span>
      </div>

      <h1>Phạm Thị Ngọc Anh</h1>
      <p class="message"> <span class="tiny-heart" aria-hidden="true">♥</span></p>

      <section class="photo-gallery" aria-label="Những khoảnh khắc đáng yêu">
        <figure class="photo-card">
          <img src="photos/ngoc-anh-01.png" alt="Ảnh chụp trước gương trong chiếc áo trắng" />
          <figcaption>Một phút dịu dàng</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="photos/ngoc-anh-02.png" alt="Ảnh chân dung cầm bảng clapperboard" />
          <figcaption>Khoảnh khắc tỏa sáng</figcaption>
        </figure>
        <figure class="photo-card photo-card--story">
          <img src="photos/ngoc-anh-03.png" alt="Ảnh ghép chuyến đi thuyền với áo phao" />
          <figcaption>Một chuyến đi đáng nhớ</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="photos/ngoc-anh-04.jpg" alt="Ảnh chân dung mặc áo bóng đá màu đỏ" />
          <figcaption>Năng lượng rạng rỡ</figcaption>
        </figure>
      </section>

      <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false">
        <span class="music-note" aria-hidden="true">♫</span>
        <span id="musicLabel">Bật giai điệu dịu dàng</span>
      </button>
      <p class="music-hint" id="musicHint">Nhấn để nghe một bản nhạc nhỏ dành riêng cho bạn</p>
    </main>

    <script>
      const musicButton = document.getElementById("musicToggle");
      const musicLabel = document.getElementById("musicLabel");
      const musicHint = document.getElementById("musicHint");
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;

      let audioContext;
      let masterGain;
      let isPlaying = false;
      let beatTimer;
      let beatIndex = 0;
      let nextBeatTime = 0;

      const beatLength = 60 / 76;
      const melody = [
        523.25, 659.25, 783.99, 880,
        783.99, 659.25, 587.33, 523.25,
        440, 523.25, 659.25, 587.33,
        523.25, 392, 440, 523.25
      ];
      const chords = [
        [261.63, 329.63, 392],
        [220, 261.63, 329.63],
        [174.61, 220, 261.63],
        [196, 246.94, 293.66]
      ];

      function ensureAudio() {
        if (!AudioContextClass) return false;
        if (!audioContext) {
          audioContext = new AudioContextClass();
          masterGain = audioContext.createGain();
          masterGain.gain.value = 0.56;
          masterGain.connect(audioContext.destination);
        }
        return true;
      }

      function playTone(frequency, startAt, duration, volume) {
        const oscillator = audioContext.createOscillator();
        const envelope = audioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, startAt);
        envelope.gain.setValueAtTime(0.0001, startAt);
        envelope.gain.exponentialRampToValueAtTime(volume, startAt + 0.035);
        envelope.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
        oscillator.connect(envelope);
        envelope.connect(masterGain);
        oscillator.start(startAt);
        oscillator.stop(startAt + duration + 0.04);
      }

      function playBeat() {
        if (!isPlaying || !audioContext) return;
        const startAt = Math.max(nextBeatTime, audioContext.currentTime + 0.025);
        const melodyNote = melody[beatIndex % melody.length];
        playTone(melodyNote, startAt, beatLength * 0.76, 0.055);
        playTone(melodyNote * 2, startAt, beatLength * 0.42, 0.008);

        if (beatIndex % 4 === 0) {
          const chord = chords[Math.floor(beatIndex / 4) % chords.length];
          chord.forEach((note, index) => {
            playTone(note, startAt, beatLength * 3.65, index === 0 ? 0.018 : 0.014);
          });
        }

        beatIndex += 1;
        nextBeatTime = startAt + beatLength;
        beatTimer = window.setTimeout(playBeat, beatLength * 1000);
      }

      musicButton.addEventListener("click", async () => {
        if (!ensureAudio()) {
          musicHint.textContent = "Trình duyệt này chưa hỗ trợ phát nhạc.";
          musicButton.disabled = true;
          return;
        }

        if (isPlaying) {
          isPlaying = false;
          window.clearTimeout(beatTimer);
          await audioContext.suspend();
          musicButton.setAttribute("aria-pressed", "false");
          musicLabel.textContent = "Bật giai điệu dịu dàng";
          musicHint.textContent = "Nhấn để nghe một bản nhạc nhỏ dành riêng cho bạn";
          return;
        }

        await audioContext.resume();
        isPlaying = true;
        nextBeatTime = audioContext.currentTime + 0.08;
        musicButton.setAttribute("aria-pressed", "true");
        musicLabel.textContent = "Tạm dừng nhạc";
        musicHint.textContent = "Một giai điệu êm dịu đang vang lên";
        playBeat();
      });
    </script>
  </body>
</html>
